# /etc/nginx/sites-available/000-default-deny  (sites-enabled 에 심볼릭 링크)
#
# 2026-10-03: aba-love.com(남의 도메인)이 이 서버 IP 를 가리켜 콩닥 화면이 그 주소로 그대로 보였다
# (3일간 약 700건). nginx 에 기본 서버가 없어 "모르는 Host" 요청이 첫 번째 server 블록(앱)으로 갔기 때문이다.
# 여기서 kongdak.kr / thekdestiny.com 이 아닌 Host 는 응답 없이 끊는다.
#
# 이 파일은 서버 설정의 사본이다(배포 스크립트가 건드리지 않는다). 바꿀 때는 서버에서
#   nginx -t && systemctl reload nginx
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
